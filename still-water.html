<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Still Water</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --page-bg: #1b2f50;
    --ink: #e4edf9;
    --chip-bg: rgba(14, 27, 50, 0.6);
    --chip-bg-hover: rgba(14, 27, 50, 0.85);
    --chip-shadow: #0a1630;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page-bg: #14243f; --chip-bg: rgba(10, 20, 40, 0.65); }
  }
  :root[data-theme="dark"] { --page-bg: #14243f; --chip-bg: rgba(10, 20, 40, 0.65); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page-bg);
    color: var(--ink);
    font-family: "Silkscreen", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    overflow: hidden;
  }
  #stage { position: fixed; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden;
    background: linear-gradient(to bottom, #34527f 0, #a9bfd9 34%, #7f9dc3 34%, #162844 100%); }
  canvas { position: absolute; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; image-rendering: pixelated; }
  .hud { position: fixed; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; pointer-events: none; padding: 0 16px; }
  .hud.top { top: calc(env(safe-area-inset-top, 0px) + 18px); }
  .hud.bottom { bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); gap: 12px; }
  .hud.top p { margin: 0; font-size: 13px; line-height: 1.8; text-align: center; max-width: 36ch; }
  #breath { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #breath[hidden] { display: none; }
  #bl { font-size: 14px; min-width: 14ch; text-align: center; }
  #bar { display: flex; gap: 3px; }
  #bar i { width: 14px; height: 8px; border: 2px solid var(--ink); background: transparent; box-sizing: border-box; }
  #bar i.on { background: var(--ink); }
  .btns { display: flex; gap: 10px; pointer-events: auto; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit; font-size: 12px; color: var(--ink);
    background: var(--chip-bg); border: 2px solid var(--ink);
    padding: 8px 12px; cursor: pointer; border-radius: 0;
    box-shadow: 3px 3px 0 var(--chip-shadow);
  }
  button:hover { background: var(--chip-bg-hover); }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--chip-shadow); }
  button:focus-visible, input[type="range"]:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  #mix {
    pointer-events: auto; display: grid; gap: 10px;
    width: min(300px, 88vw); padding: 12px 14px;
    background: var(--chip-bg); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--chip-shadow);
    font-size: 11px;
  }
  #mix[hidden] { display: none; }
  #mix label { display: grid; grid-template-columns: 9ch 1fr; align-items: center; gap: 10px; }
  #mix input[type="range"] { width: 100%; margin: 0; accent-color: var(--ink); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" role="img" aria-label="A pixel-art dusk lake in the rain, under a deep blue sky. A tall mirror that reflects nothing floats motionless on the left. In the middle a plum blossom branch floats above the water while its buds slowly open and the occasional petal drifts down onto the surface."></canvas>
</div>

<noscript><p style="position:fixed;top:40%;left:0;right:0;text-align:center;color:#e4edf9">This scene needs JavaScript.</p></noscript>

<div class="hud top"><p>everything blooms, falls,<br>and returns to nothingness.</p></div>

<div class="hud bottom">
  <div id="breath" aria-hidden="true">
    <span id="bl">breathe in</span>
    <div id="bar"></div>
  </div>
  <div id="mix" hidden></div>
  <div class="btns">
    <button id="snd" type="button" aria-pressed="false">sound: off</button>
    <button id="mixb" type="button" aria-expanded="false">mix</button>
    <button id="brb" type="button" aria-pressed="true">breath guide: on</button>
  </div>
</div>

<script>
(function () {
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var mixv = { rain: 0, wind: 0.35, water: 0.4, hum: 0.25, thunder: 0 };

  var W, H, PS, HZ, bgC, bg, fgC, fg;
  var cloudSp, mirrorSp, lines, sparks, drops, rings;
  var mirX, mirY, mirYp, GX;

  /* ---------- helpers ---------- */
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;

      return ((t ^ t >>> 14) >>> 0) / 4294967296;

  function hex(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
  function mix(a, b, t) {
    var A = hex(a), B = hex(b);
    return 'rgb(' + Math.round(A[0] + (B[0] - A[0]) * t) + ',' + Math.round(A[1] + (B[1] - A[1]) * t) + ',' + Math.round(A[2] + (B[2] - A[2]) * t) + ')';
  }
  function layer(w, h) {
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    var g = c.getContext('2d'); g.imageSmoothingEnabled = false;
    return [c, g];
  }
  function R(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); }
  function P(g, x, y, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), 1, 1); }
  function line(g, x0, y0, x1, y1, c) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    var dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
    var sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, e = dx + dy;
    g.fillStyle = c;
    for (;;) {
      g.fillRect(x0, y0, 1, 1);
      if (x0 === x1 && y0 === y1) break;

      if (e2 <= dx) { e += dx; y0 += sy; }
    }
  }
  function ell(g, cx, cy, rx, ry, c) {
    g.fillStyle = c;
    for (var y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) {
      var dy = (y + 0.5 - cy) / ry;
      if (Math.abs(dy) > 1) continue;
      var hw = rx * Math.sqrt(1 - dy * dy);
      g.fillRect(Math.round(cx - hw), y, Math.max(1, Math.round(2 * hw)), 1);
    }
  }
  function bands(g, y0, y1, colors) {
    var n = colors.length;
    for (var y = y0; y < y1; y++) {
      var f = (y - y0) / (y1 - y0) * n, i = Math.min(n - 1, Math.floor(f)), fr = f - i;
      R(g, 0, y, W, 1, colors[i]);
      if (fr > 0.72 && i < n - 1) {
        g.fillStyle = colors[i + 1];
        for (var x = (y % 2); x < W; x += 2) g.fillRect(x, y, 1, 1);
      }
    }
  }

  /* ---------- tiny 3/4-view renderer ---------- */
  function fillPoly(g, pts, col, fn) {

    for (i = 0; i < n; i++) { if (pts[i][1] < minY) minY = pts[i][1]; if (pts[i][1] > maxY) maxY = pts[i][1]; }
    var y0 = Math.ceil(minY - 0.5), y1 = Math.ceil(maxY - 0.5) - 1;
    for (var y = y0; y <= y1; y++) {
      var yc = y + 0.5, xs = [];
      for (i = 0; i < n; i++) {

        var xa = Math.ceil(xs[k] - 0.5), xb = Math.ceil(xs[k + 1] - 0.5) - 1;

    }
  }
  function Model(th, ph) {
    var c = Math.cos(th), s = Math.sin(th), cp = Math.cos(ph), sp = Math.sin(ph);
    var self = this;
    this.faces = [];
    // x right, y up, z toward viewer; yaw th, camera pitch ph

    this.vis = function (nx, ny, nz) { return nx * (-cp * s) + ny * sp + nz * cp * c; };
    this.box = function (x0, y0, z0, x1, y1, z1, m) {
      var p = self.p, f = self.faces;
      f.push({ pts: [p(x0, y0, z0), p(x0, y0, z1), p(x0, y1, z1), p(x0, y1, z0)], col: m.left, edge: m.edge });
      f.push({ pts: [p(x0, y0, z1), p(x1, y0, z1), p(x1, y1, z1), p(x0, y1, z1)], col: m.front, edge: m.edge });
      f.push({ pts: [p(x0, y1, z0), p(x1, y1, z0), p(x1, y1, z1), p(x0, y1, z1)], col: m.top, edge: m.edge });
    };
    this.render = function () {
      var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
      self.faces.forEach(function (f) { f.pts.forEach(function (q) {

      var w = Math.ceil(maxX - minX) + 4, h = Math.ceil(maxY - minY) + 4;

  }

  var FRAME = { top: '#3a5079', front: '#20335a', left: '#12213f' };
  var FABRIC = { top: '#f4e6d0', front: '#ead8bd', left: '#c4ad8e', edge: '#a38c6b' };

  function arch(hw, y0, ytop, steps) {
    var pts = [[-hw, y0], [-hw, ytop]];
    for (var i = 1; i < steps; i++) { var a = Math.PI - Math.PI * i / steps; pts.push([hw * Math.cos(a), ytop + hw * Math.sin(a)]); }
    pts.push([hw, ytop], [hw, y0]);
    return pts;
  }
  function makeMirror() {
    var m = new Model(0.52, 0.49), p = m.p, T = 2;
    var outer = arch(9, 0, 28, 14), n = outer.length;
    // visible extruded side strips
    for (var i = 0; i < n; i++) {
      var a = outer[i], c = outer[(i + 1) % n], dx = c[0] - a[0], dy = c[1] - a[1], len = Math.sqrt(dx * dx + dy * dy);
      if (len === 0) continue;
      var nx = -dy, ny = dx;
      if (m.vis(nx, ny, 0) > 0) {
        m.faces.push({ pts: [p(a[0], a[1], -T), p(c[0], c[1], -T), p(c[0], c[1], T), p(a[0], a[1], T)], col: (ny / len > 0.5) ? FRAME.top : FRAME.left });
      }
    }
    m.faces.push({ pts: outer.map(function (q) { return p(q[0], q[1], T); }), col: FRAME.front });
    m.faces.push({ pts: arch(7.5, 1.5, 28, 14).map(function (q) { return p(q[0], q[1], T); }), col: '#8aa1c3' });

    m.faces.push({
      pts: arch(6.5, 2.5, 28, 14).map(function (q) { return p(q[0], q[1], T); }),
      fn: function (x, y, y0, y1) {
        var t = (y - y0) / Math.max(1, y1 - y0);
        var u = x + y * 0.75, k = ((u % 18) + 18) % 18;
        if (k >= 5 && k < 8) return '#ecf3fb';
        if (k >= 10 && k < 11) return '#e2ebf6';

      }
    });

  }

  /* ---------- plum blossom ---------- */
  var BT = 110; // seconds for one full bloom cycle of a single flower
  // hand-drawn limbs in design units: [x, y, width], y grows upward, trunk base at 0,0
  var LIMBS = [
    [[0, 0, 8], [-4, 6, 8], [-3, 13, 7.5], [3, 18, 7], [13, 21, 6], [24, 21, 5], [34, 18, 4], [44, 14, 3], [54, 13, 2], [62, 15, 1.2]],
    [[24, 21, 4.5], [25, 29, 4], [22, 37, 3.5], [27, 45, 3], [26, 55, 2.5], [31, 65, 2], [30, 75, 1.5], [34, 85, 1]],
    [[-3, 13, 3.8], [-9, 19, 3.2], [-18, 23, 2.6], [-28, 26, 2], [-39, 30, 1.5], [-50, 31, 1]],
    [[-18, 23, 2], [-19, 32, 1.6], [-16, 41, 1.3], [-19, 51, 1], [-17, 60, 1]],
    [[44, 14, 2.6], [46, 22, 2], [50, 31, 1.6], [48, 41, 1.3], [53, 51, 1], [52, 60, 1]],
    [[26, 55, 1.8], [18, 59, 1.5], [9, 61, 1.2], [1, 66, 1]],
    [[31, 65, 1.5], [39, 68, 1.2], [48, 67, 1]],
    [[34, 18, 2], [36, 26, 1.6], [41, 34, 1.2], [40, 43, 1]]
  ];
  var VX = 1, VY = 1; // slimmer and taller than the raw design
  function catmull(pts) {
    var out = [];
    for (var i = 0; i < pts.length - 1; i++) {
      var p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
      var d = Math.sqrt((p2[0] - p1[0]) * (p2[0] - p1[0]) + (p2[1] - p1[1]) * (p2[1] - p1[1])), n = Math.max(2, Math.ceil(d / 0.7));
      for (var j = 0; j < n; j++) {
        var t = j / n, t2 = t * t, t3 = t2 * t;
        var f = function (a, b, c, e) { return 0.5 * ((2 * b) + (-a + c) * t + (2 * a - 5 * b + 4 * c - e) * t2 + (-a + 3 * b - 3 * c + e) * t3); };
        out.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1]), p1[2] + (p2[2] - p1[2]) * t]);
      }
    }
    out.push(pts[pts.length - 1].slice());

  }
  function hsh(x, y) { return ((Math.imul(x, 73856093) ^ Math.imul(y, 19349663)) >>> 0) % 1000 / 1000; }

    var S = scale || 1, r = rng(11), limbs = LIMBS.map(function (L) { return catmull(L.map(function (q) { return [q[0] * VX, q[1] * VY, q[2]]; })); });

    }
    function twig(dense, idx) {

      var ang = Math.atan2(c[1] - a[1], c[0] - a[0]) + (r() < 0.5 ? 1 : -1) * (0.55 + r() * 0.5);

      var n = Math.floor(dense.length * 0.7 / 14);

        if (xx * xx + yy * yy <= R2) { var px = Math.round(cx) + xx, py = Math.round(cy) + yy; if (px >= 0 && py >= 0 && px < w && py < h && mask[py * w + px] < v) mask[py * w + px] = v; }

    dots.concat(moss).forEach(function (q) { P(g, X(q[0]), Y(q[1]), '#17131f'); });
    buds.forEach(function (q) { var bx = Math.round(X(q[0])), by = Math.round(Y(q[1])); P(g, bx, by, '#17131f'); P(g, bx, by - 1, '#a9303f'); });

    lfo(0.05, 170, wbp.frequency); lfo(0.07, 0.3, gust.gain);
    // water lapping
    nodes.water = ac.createGain();
    var wa = loopSrc(brownBuf), wlp = biq('lowpass', 280, 0.7), lap = ac.createGain();
    lap.gain.value = 0.55; wa.connect(wlp); wlp.connect(lap); lap.connect(nodes.water); nodes.water.connect(master); lfo(0.17, 0.45, lap.gain);
    // low hum (open fifths)
    nodes.hum = ac.createGain();
    var hlp = biq('lowpass', 650, 0.5); hlp.connect(nodes.hum); nodes.hum.connect(master);
    [73.42, 110, 146.83, 220, 293.66].forEach(function (f, i) {
      [0, 5].forEach(function (det) {
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine'; o.frequency.value = f; o.detune.value = det; g.gain.value = 0.22 / (i + 1);
        o.connect(g); g.connect(hlp); o.start();
      });
    });
    // raindrops hitting the water
    plipG = ac.createGain(); plipG.gain.value = 1; plipG.connect(master);
    applyLevels();
    plipTick(); setTimeout(thunderLoop, 12000);
  }

  /* ---------- controls ---------- */
  var snd = document.getElementById('snd'), mixb = document.getElementById('mixb'), panel = document.getElementById('mix'), brb = document.getElementById('brb');
  [['rain', 'rain'], ['wind', 'wind'], ['water', 'water'], ['hum', 'low hum'], ['thunder', 'thunder']].forEach(function (r) {
    var lab = document.createElement('label'), sp = document.createElement('span'), inp = document.createElement('input');
    sp.textContent = r[1];
    inp.type = 'range'; inp.min = 0; inp.max = 100; inp.value = Math.round(mixv[r[0]] * 100);
    inp.setAttribute('aria-label', r[1] + ' volume');
    inp.addEventListener('input', function () { mixv[r[0]] = inp.value / 100; applyLevels(); });
    lab.appendChild(sp); lab.appendChild(inp); panel.appendChild(lab);
  });
  mixb.addEventListener('click', function () {
    panel.hidden = !panel.hidden;
    mixb.setAttribute('aria-expanded', String(!panel.hidden));
  });
  brb.addEventListener('click', function () {
    guideOn = !guideOn;
    brb.setAttribute('aria-pressed', String(guideOn));
    brb.textContent = 'breath guide: ' + (guideOn ? 'on' : 'off');
    breath.hidden = !guideOn;
    lastLabel = ''; lastCount = -1;
  });
  snd.addEventListener('click', function () {
    try {
      if (!ac) buildAudio();
      soundOn = !soundOn;
      if (ac.resume) ac.resume();
      master.gain.setTargetAtTime(soundOn ? 0.9 : 0, ac.currentTime, 0.6);
      snd.setAttribute('aria-pressed', String(soundOn));
      snd.textContent = 'sound: ' + (soundOn ? 'on' : 'off');
    } catch (e) { snd.textContent = 'sound: unavailable'; }
  });
})();
</script>
